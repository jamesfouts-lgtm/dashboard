<title>Beach Dashboard</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
  .panel { position: fixed; }
  #sprite { position: fixed; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 0 4px rgba(255, 255, 255, .22)); }
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="pClock" class="panel"></canvas>
<canvas id="pWeather" class="panel"></canvas>
<canvas id="pPoke" class="panel"></canvas>
<canvas id="pVerse" class="panel"></canvas>
<canvas id="pTicker" class="panel"></canvas>
<img id="sprite" alt="">

    return new Date(d0.getTime() + f * 86400e3);

const GLYPH = {};
for (const [ch, src] of Object.entries(FONT_SRC)) {
  const rows = src.split(" ");

  let c0 = 5, c1 = -1;
  rows.forEach((r) => { for (let c = 0; c < 5; c++) if (r[c] === "#") { c0 = Math.min(c0, c); c1 = Math.max(c1, c); } });
  GLYPH[ch] = { rows, c0: c1 < 0 ? 0 : c0, w: c1 < 0 ? 3 : c1 - c0 + 1 };

const DIGITS = new Set("0123456789");
function cleanText(s) {
  return String(s)
    .replace(/[‘’ʼ′]/g, "'").replace(/[“”″]/g, '"').replace(/[–—―]/g, "-").replace(/…/g, "...")
    .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
}
const glyphOf = (ch) => GLYPH[ch] || GLYPH["?"];
function textWidth(str, s = 1, tabular = false) {

function roundRect(g, x, y, w, h, r) {

const PAL_RGB = {};

const scene = (() => {
  const cv = document.getElementById("scene"), ctx = cv.getContext("2d");

  let pal = PAL_RGB.day, staticKey = "", clouds = [], wx = "clear";

  const stars = Array.from({ length: 80 }, () => ({ x: rnd(), y: rnd() * 0.85, p: rnd() * 6.28, big: rnd() < 0.12 }));
  const sparkles = Array.from({ length: 46 }, () => ({ x: rnd(), y: rnd(), p: rnd() * 6.28, v: (rnd() - 0.5) * 6 }));
  const bubbles = Array.from({ length: 5 }, () => ({ x: 0, y: -1, r: 2, v: 4, p: rnd() * 6.28 }));
  const drops = Array.from({ length: 150 }, () => ({ x: rnd(), y: rnd() }));
  let flashUntil = 0, nextFlash = 0;

  const shore = (x) => 167 + 3 * Math.sin(x * 0.045) + 2 * Math.sin(x * 0.11 + 1.3);

  function sunTimes(t) {
    const sr = (WX && WX.sunrise) ? new Date(WX.sunrise) : null, ss = (WX && WX.sunset) ? new Date(WX.sunset) : null;
    const base = new Date(t); base.setHours(0, 0, 0, 0);

  }
  function weatherKind() {

      fog: "fog", rain: "rain", snow: "snow", storm: "storm" }[w] || "clear";
  }

  /* ----- static layers (rebuilt every minute or when the palette changes) ----- */
  function pixelLayer(c) {

  }

      const t = y / HOR, lv = 14, v = t * lv, b = Math.floor(v), q = (v - b) > bayer(x, y) ? b + 1 : b, tt = Math.min(1, q / lv);

    const haze = (c, a) => S(mix(c, pal.skyLow, a));
    for (let x = 18; x < 98; x++) {                                 // small far island
      const hgt = Math.round(5 * Math.sin(Math.PI * (x - 18) / 80) + (x > 44 && x < 70 ? 2 : 0));
      for (let y = HOR - hgt; y < HOR; y++) land.set(x, y, haze(y === HOR - hgt ? mix(pal.far, pal.skyLow, 0.2) : pal.far, 0.38));
    }
    const hx = Math.round(W * 0.8) + 6;                             // headland on the right, past where the sun sets
    for (let x = hx; x < W; x++) {
      const h = Math.round(30 * smooth(hx, hx + 44, x) + 4 * smooth(hx + 44, W, x) + 1.6 * Math.sin(x * 0.37) + 1.2 * Math.sin(x * 0.93 + 2));

      if (((x - hole.cx) / hole.rx) ** 2 + ((y - hole.cy) / hole.ry) ** 2 < 1 && y > 150) continue;

      for (const b of blobs) { const d = ((x - b.cx) / b.rx) ** 2 + ((y - b.cy) / b.ry) ** 2; if (d < 1 && d < bd) { bd = d; best = b; } }

        if (y <= ys + 3) col = pal.wet;

      }

    }
  }

  /* ----- dynamic bits, drawn every frame ----- */
  function px(x, y, col, a = 1) { ctx.fillStyle = rgb(col, a); ctx.fillRect(x | 0, y | 0, 1, 1); }

    const m = t.getHours() * 60 + t.getMinutes() + t.getSeconds() / 60;

  }
  function drawSun(b, T) {

  }

  function frame() {
    const t = now(), T = performance.now() / 1000;
    const kind = weatherKind();
    const key = `${t.getHours()}:${t.getMinutes()}:${Math.floor(t.getSeconds() / (DEBUG.demo ? 1 : 60))}|${kind}|${W}`;
    if (key !== staticKey) { pal = paletteAt(t); wx = kind; buildStatic(); staticKey = key; }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(layers.sky, 0, 0);

    if (pal.stars > 0.02 && wx !== "cloudy" && wx !== "rain" && wx !== "storm") {

    for (const b of bubbles) {

function wmo(code, isDay = 1) {
  const day = !!isDay;
  if (code === 0) return { label: "Clear", icon: day ? "sun" : "moon" };
  if (code === 1) return { label: "Mostly clear", icon: day ? "sun" : "moon" };
  if (code === 2) return { label: "Partly cloudy", icon: day ? "partSun" : "partMoon" };
  if (code === 3) return { label: "Cloudy", icon: "cloud" };
  if (code === 45 || code === 48) return { label: "Fog", icon: "fog" };
  if (code >= 51 && code <= 57) return { label: "Drizzle", icon: "rain" };
  if (code >= 61 && code <= 67) return { label: code >= 65 ? "Heavy rain" : "Rain", icon: "rain" };
  if (code >= 71 && code <= 77) return { label: "Snow", icon: "snow" };
  if (code >= 80 && code <= 82) return { label: "Showers", icon: "rain" };
  if (code === 85 || code === 86) return { label: "Snow showers", icon: "snow" };
  if (code >= 95) return { label: "Storms", icon: "storm" };
  return { label: "-", icon: "cloud" };
}

async function getLocation() {

function parseEvent(e, key) {

function wrapText(text, maxW) {
  const lines = []; let line = "";

    if (textWidth(test) <= maxW) { line = test; continue; }
    if (line) lines.push(line);
    line = word;
    while (textWidth(line) > maxW) { let cut = line.length - 1; while (cut > 1 && textWidth(line.slice(0, cut)) > maxW) cut--; lines.push(line.slice(0, cut)); line = line.slice(cut); }
  }
  if (line) lines.push(line);

}

/* ----- Scrolling NFL / NBA bar ----- */
function buildTicker(games) {
  const segs = [], rank = { in: 0, pre: 1, post: 2 };
  for (const key of CONFIG.leagues) {
    const list = games.filter((g) => g.league === key)
      .sort((a, b) => (rank[a.state] - rank[b.state]) || (a.state === "post" ? b.date - a.date : a.date - b.date));
    if (!list.length) continue;
    segs.push([LEAGUES[key].label, LEAGUES[key].color], ["   ", COL.team]);
    list.forEach((g) => {
      const pre = g.state === "pre";
      const status = pre ? (g.date.toDateString() === now().toDateString() ? fmtTime(g.date) : g.date.toLocaleDateString("en-US", { weekday: "short" }) + " " + fmtTime(g.date)) : g.state === "post" ? "FINAL" : g.detail;
      segs.push([g.away.abbr, COL.team]);
      if (!pre) segs.push([" " + g.away.score, COL.score]);
      segs.push([pre ? " @ " : "  ", COL.dim], [g.home.abbr, COL.team]);
      if (!pre) segs.push([" " + g.home.score, COL.score]);
      segs.push(["  " + cleanText(status).toUpperCase(), g.state === "in" ? COL.live : pre ? COL.soon : COL.final], ["   •   ", COL.dim]);
    });
  }
  if (!segs.length) segs.push(["NO NFL OR NBA GAMES ON THE SCHEDULE", COL.dim], ["   •   ", COL.dim]);
  return segs;
}
const ticker = {
  segs: null, pending: null, offset: 0, total: 0,
  setItems(segs) { if (!this.segs) { this.segs = segs; this.measure(); } else this.pending = segs; },
  measure() { this.total = this.segs.reduce((w, [t]) => w + textWidth(t.toUpperCase(), 2) + 2, 0); },
  step() {
    const pn = panels.ticker; if (!pn.w) return;
    this.offset++;
    if (this.segs && this.offset > this.total + pn.w) { this.offset = 0; if (this.pending) { this.segs = this.pending; this.pending = null; this.measure(); } }
    const c = pn.begin();
    if (this.segs) {
      let x = pn.w - this.offset;
      for (const [t, col] of this.segs) {
        const txt = t.toUpperCase(), w = textWidth(txt, 2);
        if (x + w > 1 && x < pn.w - 1) drawText(c, txt, x, 5, 2, col, { minX: 1, maxX: pn.w - 1 });
        x += w + 2;
        if (x > pn.w) break;
      }
    } else drawText(c, "LOADING SCORES...", 6, 5, 2, COL.dim);
    pn.end();
  },
};
